<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 two 1 - Shared Note</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-vanilla: #F8F0E3;
            --paper: #fffcf8;
            --line: #d1c4b5;
            --ink: #5a4a42;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-vanilla);
            color: var(--ink);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* اللوجو العلوي */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-text {
            font-size: 40px;
            font-weight: 900;
            color: #3e2f28;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }
        .logo-sub {
            font-size: 14px;
            color: #8b7366;
            margin-top: -10px;
        }

        /* شكل صفحة الكراسة */
        .notebook {
            width: 100%;
            max-width: 500px;
            background-color: var(--paper);
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 
                0 1px 4px rgba(0,0,0,0.05), 
                0 10px 20px rgba(90, 74, 66, 0.1);
            position: relative;
            /* خط جانبي أحمر زي الكراسات */
            background-image: linear-gradient(to right, transparent 93%, #ffcccc 93%, #ffcccc 94%, transparent 94%);
        }

        /* سطر الشخص */
        .person-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
            position: relative;
        }

        .icon {
            font-size: 24px;
            margin-left: 15px;
            margin-top: 5px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
        }

        .inputs-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* الاستايل بتاع السطر */
        .line-input {
            width: 100%;
            border: none;
            background: transparent;
            border-bottom: 1.5px solid var(--line);
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            color: var(--ink);
            padding: 5px 0;
            outline: none;
            transition: 0.3s;
        }
        .line-input:focus {
            border-bottom-color: #8b7366;
            background-color: rgba(255, 255, 255, 0.4);
        }

        .name-field {
            font-weight: 700;
            font-size: 20px;
            color: #3e2f28;
        }

        textarea.line-input {
            resize: none;
            overflow: hidden;
            min-height: 40px;
            line-height: 1.6;
        }

        .debt-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 14px;
            margin-top: 5px;
            color: #8b7366;
        }
        .debt-field {
            width: 70px;
            text-align: center;
            font-weight: bold;
            color: #d32f2f; /* لون أحمر للمديونية */
            margin: 0 5px;
        }

        /* فاصل منقط بين الشخصين */
        .separator {
            border-top: 2px dashed var(--line);
            margin: 20px 0;
            position: relative;
        }
        /* شكل مقص صغير ع الخط */
        .separator::after {
            content: '✂️';
            position: absolute;
            left: -10px;
            top: -12px;
            font-size: 14px;
            opacity: 0.5;
        }

        .status-bar {
            margin-top: 20px;
            font-size: 12px;
            color: #8b7366;
            background: rgba(255,255,255,0.5);
            padding: 5px 15px;
            border-radius: 20px;
        }

    </style>
</head>
<body>

    <div class="logo-container">
        <div class="logo-text">1 2 1</div>
        <div class="logo-sub">Shared Coffee Note</div>
    </div>

    <div class="notebook">
        
        <div class="person-row">
            <div class="icon">☕</div>
            <div class="inputs-group">
                <input type="text" id="p1_name" class="line-input name-field" placeholder="الاسم الأول..." oninput="autoSave()">
                <textarea id="p1_note" class="line-input" placeholder="اكتب المشروبات..." oninput="autoSave(); autoResize(this)"></textarea>
                <div class="debt-container">
                    عليك: <input type="number" id="p1_debt" class="line-input debt-field" placeholder="0" oninput="autoSave()"> ج.م
                </div>
            </div>
        </div>

        <div class="separator"></div>

        <div class="person-row">
            <div class="icon">☕</div>
            <div class="inputs-group">
                <input type="text" id="p2_name" class="line-input name-field" placeholder="الاسم الثاني..." oninput="autoSave()">
                <textarea id="p2_note" class="line-input" placeholder="اكتب المشروبات..." oninput="autoSave(); autoResize(this)"></textarea>
                <div class="debt-container">
                    عليك: <input type="number" id="p2_debt" class="line-input debt-field" placeholder="0" oninput="autoSave()"> ج.م
                </div>
            </div>
        </div>

    </div>

    <div id="status" class="status-bar">في انتظار الاتصال...</div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>

    <script>
        // ==========================================
        // بيانات مشروعك (تمت إضافتها بنجاح)
        // ==========================================
        
        const firebaseConfig = {
            apiKey: "AIzaSyC41wbgVjetsHSi0xyRsoZypigr9rDTwsY",
            authDomain: "project-5583219622905769256.firebaseapp.com",
            databaseURL: "https://project-5583219622905769256-default-rtdb.firebaseio.com",
            projectId: "project-5583219622905769256",
            storageBucket: "project-5583219622905769256.firebasestorage.app",
            messagingSenderId: "11178686775",
            appId: "1:11178686775:web:112f416c31f02233df42b2",
            measurementId: "G-RLHEZ6C1LV"
        };

        // تهيئة فايربيس
        const app = firebase.initializeApp(firebaseConfig);
        const analytics = firebase.analytics(); // تم تفعيل الأناليتكس
        const db = firebase.database();

        // ==========================================
        // منطق البرنامج (Logic)
        // ==========================================

        // الاستماع للتغييرات القادمة من السيرفر
        db.ref('notebook_v2').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                updateField('p1_name', data.p1?.name);
                updateField('p1_note', data.p1?.note);
                updateField('p1_debt', data.p1?.debt);
                
                updateField('p2_name', data.p2?.name);
                updateField('p2_note', data.p2?.note);
                updateField('p2_debt', data.p2?.debt);
                
                document.getElementById('status').innerText = "✅ متصل - البيانات محدثة";
            }
        });

        // دالة الحفظ التلقائي عند الكتابة
        function autoSave() {
            document.getElementById('status').innerText = "⏳ جاري الحفظ...";
            
            db.ref('notebook_v2').set({
                p1: {
                    name: document.getElementById('p1_name').value,
                    note: document.getElementById('p1_note').value,
                    debt: document.getElementById('p1_debt').value
                },
                p2: {
                    name: document.getElementById('p2_name').value,
                    note: document.getElementById('p2_note').value,
                    debt: document.getElementById('p2_debt').value
                }
            }).catch(error => {
                console.error("Error saving:", error);
                document.getElementById('status').innerText = "❌ خطأ في الحفظ (تأكد من الانترنت)";
            });
        }

        // دالة مساعدة لتحديث الحقول دون مقاطعة الكتابة
        function updateField(id, value) {
            const el = document.getElementById(id);
            // الشرط ده مهم عشان لو أنا اللي بكتب، المؤشر ميرجعش لورا
            if (document.activeElement !== el) {
                el.value = value || "";
                if(el.tagName === 'TEXTAREA') autoResize(el);
            }
        }

        // دالة تكبير خانة الكتابة تلقائياً
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }
    </script>
</body>
</html>
