<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1 2 1 - Professional</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-crema: #F2EAD3;
            --paper-white: #FFFCF7;
            --espresso-brown: #4A3B32;
            --latte-brown: #8C7B70;
            --line-color: #E0D6CC;
            --debt-red: #C0392B;
            --gold: #D4AF37;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-crema);
            background-image: radial-gradient(circle at center, transparent 0%, var(--bg-crema) 100%), url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 30c0-5.523 4.477-10 10-10s10 4.477 10 10-4.477 10-10 10-10-4.477-10-10z' fill='%234A3B32' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: var(--espresso-brown);
            margin: 0;
            padding: 20px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- شاشة القفل --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-crema); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .login-box {
            background: var(--paper-white); padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 15px 30px rgba(74, 59, 50, 0.15); border: 1px solid var(--line-color);
        }
        .login-input {
            padding: 12px; font-size: 22px; text-align: center; border: 2px solid var(--line-color);
            border-radius: 12px; margin: 20px 0; background: #FAF8F5; font-family: 'Cairo', sans-serif; outline: none;
            width: 100%;
        }
        .login-btn {
            background: var(--espresso-brown); color: white; border: none; padding: 12px 40px;
            border-radius: 12px; font-size: 18px; cursor: pointer; font-family: 'Cairo', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* --- الهيدر واللوجو --- */
        .header-container { margin-bottom: 20px; text-align: center; }
        .logo-wrapper { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .main-logo-text { font-size: 50px; font-weight: 900; color: var(--espresso-brown); text-shadow: 2px 2px 4px rgba(74, 59, 50, 0.1); }
        .coffee-bean-decor { font-size: 32px; color: transparent; text-shadow: 0 0 0 var(--espresso-brown); filter: drop-shadow(1px 1px 1px rgba(74, 59, 50, 0.2)); }
        .logo-sub { font-size: 14px; font-weight: 700; color: var(--latte-brown); text-transform: uppercase; letter-spacing: 1px; }

        /* --- جسم الكراسة --- */
        .notebook {
            width: 100%; max-width: 600px;
            background-color: var(--paper-white);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05), 0 20px 40px rgba(74, 59, 50, 0.12);
            border: 1px solid #EDE6DE;
            min-height: 400px;
            position: relative;
        }
        .notebook::before {
            content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 4px;
            background: var(--gold); border-radius: 0 0 4px 4px; opacity: 0.5;
        }

        /* --- عنصر الشخص --- */
        .person-item {
            display: flex; align-items: flex-start; margin-bottom: 25px; padding-bottom: 25px;
            border-bottom: 2px dashed var(--line-color); position: relative;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .inputs-group { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-left: 15px; }

        .line-input {
            width: 100%; border: none; background: transparent;
            border-bottom: 2px solid var(--line-color);
            font-family: 'Cairo', sans-serif; font-size: 18px; color: var(--espresso-brown);
            padding: 6px 0; outline: none; transition: 0.3s;
        }
        .line-input:focus { border-bottom-color: var(--espresso-brown); }
        .name-field { font-weight: 900; font-size: 20px; }
        textarea.line-input { resize: none; overflow: hidden; min-height: 40px; line-height: 1.6; }

        .debt-container { display: flex; align-items: center; font-size: 15px; color: var(--latte-brown); font-weight: 700; margin-top: 5px; }
        .debt-field { width: 80px; text-align: center; font-weight: 900; color: var(--debt-red); margin: 0 5px; font-size: 18px; border-bottom: 2px solid var(--debt-red); }

        .end-icon { font-size: 26px; margin-top: 5px; color: var(--espresso-brown); }

        .delete-btn {
            position: absolute; left: -15px; top: 0; background: #ffebee; border: none; color: #e74c3c;
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer; opacity: 0; font-size: 14px;
            transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center;
        }
        .person-item:hover .delete-btn { opacity: 1; left: -10px; }

        .actions-area { margin-top: 30px; display: flex; gap: 15px; justify-content: center; }
        
        .btn-circle {
            width: 50px; height: 50px; border-radius: 50%; border: none; color: white;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .add-btn { background-color: var(--espresso-brown); }
        .camera-btn { background-color: var(--latte-brown); font-size: 20px; }
        .btn-circle:hover { transform: scale(1.1); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }

        /* --- الشريط السفلي العائم --- */
        .floating-footer {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--espresso-brown); color: white;
            padding: 12px 30px; border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 15px;
            z-index: 100; min-width: 250px; justify-content: center;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .total-label { font-size: 14px; opacity: 0.8; }
        .total-amount { font-size: 22px; font-weight: 900; color: #fff; }
        .currency { font-size: 14px; color: var(--gold); }

    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <div class="logo-wrapper" style="transform: scale(0.8); margin-bottom: 10px;">
                <span class="coffee-bean-decor">🫘</span>
                <div class="main-logo-text">1 2 1</div>
                <span class="coffee-bean-decor" style="transform: scaleX(-1);">🫘</span>
            </div>
            <p style="font-weight: bold; color: var(--latte-brown);">أدخل الرمز السري</p>
            <input type="password" id="pass-input" class="login-input" placeholder="••••">
            <button onclick="checkPassword()" class="login-btn">فتح الكراسة</button>
            <p id="error-msg" style="color:var(--debt-red); display:none; margin-top:10px;">الرمز خطأ!</p>
        </div>
    </div>

    <div id="app-content" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        
        <div class="header-container">
            <div class="logo-wrapper">
                <span class="coffee-bean-decor" style="transform: rotate(-20deg);">🫘</span>
                <div class="main-logo-text">1 2 1</div>
                <span class="coffee-bean-decor" style="transform: rotate(20deg) scaleX(-1);">🫘</span>
            </div>
            <div class="logo-sub">Professional Coffee Note</div>
        </div>

        <div class="notebook" id="capture-area">
            <div id="users-list"></div>
            
            <div class="actions-area" data-html2canvas-ignore="true">
                <button onclick="addNewUser()" class="btn-circle add-btn" title="إضافة شخص">+</button>
                <button onclick="takeScreenshot()" class="btn-circle camera-btn" title="حفظ كصورة">📸</button>
            </div>
        </div>

        <div class="floating-footer">
            <span class="total-label">إجمالي الكراسة:</span>
            <span id="total-sum" class="total-amount">0</span>
            <span class="currency">جنية</span>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC41wbgVjetsHSi0xyRsoZypigr9rDTwsY",
            authDomain: "project-5583219622905769256.firebaseapp.com",
            databaseURL: "https://project-5583219622905769256-default-rtdb.firebaseio.com",
            projectId: "project-5583219622905769256",
            storageBucket: "project-5583219622905769256.firebasestorage.app",
            messagingSenderId: "11178686775",
            appId: "1:11178686775:web:112f416c31f02233df42b2",
            measurementId: "G-RLHEZ6C1LV"
        };

        let db;
        
        // غيرت الصوت هنا لصوت هادي جداً (Pop)
        const popSound = new Audio("http://codeskulptor-demos.commondatastorage.googleapis.com/pang/pop.mp3");

        function checkPassword() {
            if (document.getElementById('pass-input').value === "121") {
                const screen = document.getElementById('login-screen');
                screen.style.opacity = '0';
                setTimeout(() => {
                    screen.style.display = "none";
                    document.getElementById('app-content').style.display = "flex";
                    initFirebase();
                }, 500);
            } else {
                document.getElementById('error-msg').style.display = "block";
            }
        }

        function initFirebase() {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();

                db.ref('users_pro').on('value', (snapshot) => {
                    const data = snapshot.val();
                    renderUsers(data);
                    calculateTotal(data);
                });
            }
        }

        function renderUsers(data) {
            const container = document.getElementById('users-list');
            if (!data) {
                container.innerHTML = "<p style='text-align:center; color:#999; margin-top:50px;'>الكراسة فاضية.. دوس (+) عشان تضيف حد</p>";
                return;
            }
            if (container.innerHTML.includes("الكراسة فاضية")) container.innerHTML = "";

            Object.keys(data).forEach(key => {
                const user = data[key];
                let userDiv = document.getElementById(`user-${key}`);

                if (!userDiv) {
                    userDiv = document.createElement('div');
                    userDiv.id = `user-${key}`;
                    userDiv.className = 'person-item';
                    userDiv.innerHTML = `
                        <button class="delete-btn" onclick="deleteUser('${key}')">✕</button>
                        <div class="inputs-group">
                            <input type="text" id="name-${key}" class="line-input name-field" placeholder="الاسم..." oninput="updateUser('${key}')">
                            <textarea id="note-${key}" class="line-input" placeholder="الطلبات..." oninput="updateUser('${key}'); autoResize(this)"></textarea>
                            <div class="debt-container">
                                الحساب: <input type="number" id="debt-${key}" class="line-input debt-field" placeholder="0" oninput="updateUser('${key}')"> جنية
                            </div>
                        </div>
                        <div class="end-icon">☕</div>
                    `;
                    container.appendChild(userDiv);
                    // تشغيل الصوت الهادي عند ظهور شخص جديد
                    popSound.play().catch(()=>{}); 
                }

                const nameInput = document.getElementById(`name-${key}`);
                const noteInput = document.getElementById(`note-${key}`);
                const debtInput = document.getElementById(`debt-${key}`);

                if (document.activeElement !== nameInput) nameInput.value = user.name || "";
                if (document.activeElement !== noteInput) {
                    noteInput.value = user.note || "";
                    autoResize(noteInput);
                }
                if (document.activeElement !== debtInput) debtInput.value = user.debt || "";
            });

            const currentIds = Object.keys(data);
            const domDivs = container.getElementsByClassName('person-item');
            for (let i = domDivs.length - 1; i >= 0; i--) {
                const divId = domDivs[i].id.replace('user-', '');
                if (!currentIds.includes(divId)) {
                    domDivs[i].remove();
                }
            }
        }

        function calculateTotal(data) {
            let total = 0;
            if (data) {
                Object.values(data).forEach(user => {
                    total += Number(user.debt) || 0;
                });
            }
            animateValue("total-sum", parseInt(document.getElementById("total-sum").innerText), total, 500);
        }

        function animateValue(id, start, end, duration) {
            if (start === end) return;
            const range = end - start;
            let current = start;
            const increment = end > start ? 1 : -1;
            const stepTime = Math.abs(Math.floor(duration / range));
            const obj = document.getElementById(id);
            const timer = setInterval(function() {
                current += increment;
                obj.innerHTML = current;
                if (current == end) { clearInterval(timer); }
            }, Math.max(stepTime, 10));
        }

        function addNewUser() {
            const newKey = db.ref('users_pro').push().key;
            db.ref('users_pro/' + newKey).set({ name: "", note: "", debt: 0 });
        }

        function updateUser(key) {
            db.ref('users_pro/' + key).update({
                name: document.getElementById(`name-${key}`).value,
                note: document.getElementById(`note-${key}`).value,
                debt: document.getElementById(`debt-${key}`).value
            });
        }

        function deleteUser(key) {
            if(confirm("أكيد عايز تمسح الشخص ده من الكراسة؟")) {
                db.ref('users_pro/' + key).remove();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function takeScreenshot() {
            const btn = document.querySelector('.camera-btn');
            btn.innerHTML = "⏳";
            html2canvas(document.getElementById("capture-area"), {
                scale: 2, backgroundColor: "#FFFCF7"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'fatoura-121.png';
                link.href = canvas.toDataURL();
                link.click();
                btn.innerHTML = "📸";
                alert("تم حفظ صورة الفاتورة! ✅");
            });
        }
    </script>
</body>
</html>
