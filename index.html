<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1 2 1 - Smart Cashier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-crema: #F2EAD3;
            --paper-white: #FFFCF7;
            --espresso-brown: #4A3B32;
            --latte-brown: #8C7B70;
            --line-color: #E0D6CC;
            --debt-red: #C0392B;
            --gold: #D4AF37;
            --green-price: #27ae60;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-crema);
            background-image: radial-gradient(circle at center, transparent 0%, var(--bg-crema) 100%), url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 30c0-5.523 4.477-10 10-10s10 4.477 10 10-4.477 10-10 10-10-4.477-10-10z' fill='%234A3B32' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: var(--espresso-brown);
            margin: 0;
            padding: 20px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- شاشة القفل --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-crema); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .login-box {
            background: var(--paper-white); padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 15px 30px rgba(74, 59, 50, 0.15); border: 1px solid var(--line-color);
        }
        .login-input {
            padding: 12px; font-size: 22px; text-align: center; border: 2px solid var(--line-color);
            border-radius: 12px; margin: 20px 0; background: #FAF8F5; font-family: 'Cairo', sans-serif; outline: none; width: 100%;
        }
        .login-btn {
            background: var(--espresso-brown); color: white; border: none; padding: 12px 40px;
            border-radius: 12px; font-size: 18px; cursor: pointer; font-family: 'Cairo', sans-serif;
        }

        /* --- الهيدر واللوجو --- */
        .header-container { margin-bottom: 20px; text-align: center; }
        .logo-wrapper { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .main-logo-text { font-size: 50px; font-weight: 900; color: var(--espresso-brown); text-shadow: 2px 2px 4px rgba(74, 59, 50, 0.1); }
        .coffee-bean-decor { font-size: 32px; color: transparent; text-shadow: 0 0 0 var(--espresso-brown); filter: drop-shadow(1px 1px 1px rgba(74, 59, 50, 0.2)); }
        .logo-sub { font-size: 14px; font-weight: 700; color: var(--latte-brown); text-transform: uppercase; letter-spacing: 1px; }

        /* --- جسم الكراسة --- */
        .notebook {
            width: 100%; max-width: 600px;
            background-color: var(--paper-white);
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05), 0 20px 40px rgba(74, 59, 50, 0.12);
            border: 1px solid #EDE6DE;
            min-height: 400px;
            position: relative;
        }
        .notebook::before {
            content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 4px;
            background: var(--gold); border-radius: 0 0 4px 4px; opacity: 0.5;
        }

        /* --- كارت الشخص --- */
        .person-card {
            background: #fff;
            border: 1px solid var(--line-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* رأس الكارت (الاسم) */
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px dashed var(--line-color); padding-bottom: 10px; margin-bottom: 10px;
        }
        .name-input {
            border: none; background: transparent; font-size: 20px; font-weight: 900;
            color: var(--espresso-brown); width: 100%; outline: none;
        }
        .delete-user-btn {
            background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 18px; opacity: 0.5;
        }
        .delete-user-btn:hover { opacity: 1; }

        /* قائمة الطلبات */
        .items-list { margin-bottom: 15px; }
        
        /* سطر الطلب الواحد */
        .item-row {
            display: flex; gap: 10px; align-items: center; margin-bottom: 8px;
        }
        .item-name {
            flex: 2; border: none; border-bottom: 1px solid var(--line-color);
            padding: 5px; font-family: 'Cairo', sans-serif; font-size: 16px; outline: none;
            background: transparent;
        }
        .item-price {
            flex: 1; border: none; border-bottom: 1px solid var(--line-color);
            padding: 5px; font-family: 'Cairo', sans-serif; font-size: 16px; outline: none;
            background: transparent; text-align: center; color: var(--green-price); font-weight: bold;
        }
        .btn-remove-item {
            color: #e74c3c; background: none; border: none; cursor: pointer; font-size: 18px; padding: 0 5px;
        }

        /* أزرار التحكم داخل الكارت */
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        
        .btn-add-item {
            background: var(--latte-brown); color: white; border: none; padding: 5px 15px;
            border-radius: 15px; font-size: 13px; cursor: pointer; font-family: 'Cairo';
        }
        
        .user-total {
            font-size: 16px; font-weight: bold; color: var(--espresso-brown);
        }
        .user-total span { color: var(--debt-red); font-size: 20px; font-weight: 900; }

        /* الأزرار الرئيسية */
        .main-actions { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .btn-circle {
            width: 55px; height: 55px; border-radius: 50%; border: none; color: white;
            font-size: 28px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .add-user-btn { background-color: var(--espresso-brown); }
        .camera-btn { background-color: var(--latte-brown); font-size: 22px; }
        .btn-circle:hover { transform: scale(1.1); }

        /* الشريط السفلي */
        .floating-footer {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--espresso-brown); color: white;
            padding: 12px 30px; border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 15px;
            z-index: 100; min-width: 280px; justify-content: center;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .total-amount { font-size: 24px; font-weight: 900; color: #fff; }

    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <div class="logo-wrapper" style="transform: scale(0.8); margin-bottom: 10px;">
                <span class="coffee-bean-decor">🫘</span>
                <div class="main-logo-text">1 2 1</div>
                <span class="coffee-bean-decor" style="transform: scaleX(-1);">🫘</span>
            </div>
            <p style="font-weight: bold; color: var(--latte-brown);">أدخل الرمز السري</p>
            <input type="password" id="pass-input" class="login-input" placeholder="••••">
            <button onclick="checkPassword()" class="login-btn">فتح الكراسة</button>
            <p id="error-msg" style="color:var(--debt-red); display:none; margin-top:10px;">الرمز خطأ!</p>
        </div>
    </div>

    <div id="app-content" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        
        <div class="header-container">
            <div class="logo-wrapper">
                <span class="coffee-bean-decor" style="transform: rotate(-20deg);">🫘</span>
                <div class="main-logo-text">1 2 1</div>
                <span class="coffee-bean-decor" style="transform: rotate(20deg) scaleX(-1);">🫘</span>
            </div>
            <div class="logo-sub">Smart Order System</div>
        </div>

        <div class="notebook" id="capture-area">
            <div id="users-container">
                </div>
            
            <div class="main-actions" data-html2canvas-ignore="true">
                <button onclick="addNewUser()" class="btn-circle add-user-btn" title="شخص جديد">+</button>
                <button onclick="takeScreenshot()" class="btn-circle camera-btn" title="تصوير">📸</button>
            </div>
        </div>

        <div class="floating-footer">
            <span style="font-size: 14px; opacity: 0.8;">الإجمالي الكلي:</span>
            <span id="grand-total" class="total-amount">0</span>
            <span style="font-size: 14px; color: var(--gold);">جنية</span>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC41wbgVjetsHSi0xyRsoZypigr9rDTwsY",
            authDomain: "project-5583219622905769256.firebaseapp.com",
            databaseURL: "https://project-5583219622905769256-default-rtdb.firebaseio.com",
            projectId: "project-5583219622905769256",
            storageBucket: "project-5583219622905769256.firebasestorage.app",
            messagingSenderId: "11178686775",
            appId: "1:11178686775:web:112f416c31f02233df42b2",
            measurementId: "G-RLHEZ6C1LV"
        };

        let db;
        const popSound = new Audio("http://codeskulptor-demos.commondatastorage.googleapis.com/pang/pop.mp3");

        function checkPassword() {
            if (document.getElementById('pass-input').value === "121") {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = "none";
                    document.getElementById('app-content').style.display = "flex";
                    initFirebase();
                }, 500);
            } else {
                document.getElementById('error-msg').style.display = "block";
            }
        }

        function initFirebase() {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();

                // غيرنا المسار لـ notebook_v3 عشان النسخة الجديدة
                db.ref('notebook_v3').on('value', (snapshot) => {
                    const data = snapshot.val();
                    renderAll(data);
                });
            }
        }

        // دالة الرسم الرئيسية (Render)
        function renderAll(data) {
            const container = document.getElementById('users-container');
            let grandTotal = 0;

            if (!data) {
                container.innerHTML = "<p style='text-align:center; color:#aaa;'>ابدأ بإضافة أشخاص (+)</p>";
                document.getElementById('grand-total').innerText = "0";
                return;
            }

            // لو كان فيه رسالة "فاضي"، شيلها
            if(container.innerHTML.includes("ابدأ بإضافة")) container.innerHTML = "";

            // 1. التعامل مع البيانات (Data Processing)
            Object.keys(data).forEach(userId => {
                const user = data[userId];
                
                // حساب إجمالي الشخص
                let userTotal = 0;
                if(user.items) {
                    Object.values(user.items).forEach(item => {
                        userTotal += Number(item.price) || 0;
                    });
                }
                grandTotal += userTotal;

                // هل الكارت موجود؟ لو لأ اصنعه
                let card = document.getElementById(`card-${userId}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${userId}`;
                    card.className = 'person-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <input type="text" id="name-${userId}" class="name-input" placeholder="اسم الشخص..." oninput="updateName('${userId}', this.value)">
                            <button class="delete-user-btn" onclick="deleteUser('${userId}')">×</button>
                        </div>
                        <div class="items-list" id="items-${userId}">
                            </div>
                        <div class="card-actions">
                            <button class="btn-add-item" onclick="addItem('${userId}')">+ طلب جديد</button>
                            <div class="user-total">الإجمالي: <span id="total-${userId}">0</span> ج.م</div>
                        </div>
                    `;
                    container.appendChild(card);
                    popSound.play().catch(()=>{});
                }

                // تحديث الاسم (دون تضييع التركيز)
                const nameInput = document.getElementById(`name-${userId}`);
                if (document.activeElement !== nameInput) nameInput.value = user.name || "";

                // تحديث الإجمالي المعروض للشخص
                document.getElementById(`total-${userId}`).innerText = userTotal;

                // معالجة عناصر القائمة (Items)
                const itemsContainer = document.getElementById(`items-${userId}`);
                const itemsData = user.items || {};
                
                // رسم كل طلب
                Object.keys(itemsData).forEach(itemId => {
                    const item = itemsData[itemId];
                    let itemRow = document.getElementById(`item-${itemId}`);
                    
                    if(!itemRow) {
                        itemRow = document.createElement('div');
                        itemRow.id = `item-${itemId}`;
                        itemRow.className = 'item-row';
                        itemRow.innerHTML = `
                            <input type="text" class="item-name" id="iname-${itemId}" placeholder="الطلب" oninput="updateItem('${userId}', '${itemId}')">
                            <input type="number" class="item-price" id="iprice-${itemId}" placeholder="السعر" oninput="updateItem('${userId}', '${itemId}')">
                            <button class="btn-remove-item" onclick="deleteItem('${userId}', '${itemId}')">×</button>
                        `;
                        itemsContainer.appendChild(itemRow);
                    }

                    // تحديث القيم داخل الطلب
                    const iName = document.getElementById(`iname-${itemId}`);
                    const iPrice = document.getElementById(`iprice-${itemId}`);
                    
                    if(document.activeElement !== iName) iName.value = item.text || "";
                    if(document.activeElement !== iPrice) iPrice.value = item.price || "";
                });

                // تنظيف الطلبات المحذوفة
                const currentItemIds = Object.keys(itemsData);
                const domItems = itemsContainer.getElementsByClassName('item-row');
                for (let i = domItems.length - 1; i >= 0; i--) {
                    const id = domItems[i].id.replace('item-', '');
                    if(!currentItemIds.includes(id)) domItems[i].remove();
                }
            });

            // تنظيف الكروت المحذوفة
            const currentUserIds = Object.keys(data);
            const domCards = container.getElementsByClassName('person-card');
            for (let i = domCards.length - 1; i >= 0; i--) {
                const id = domCards[i].id.replace('card-', '');
                if(!currentUserIds.includes(id)) domCards[i].remove();
            }

            // تحديث الإجمالي الكلي أسفل الشاشة
            animateValue("grand-total", parseInt(document.getElementById("grand-total").innerText), grandTotal, 500);
        }

        // --- دوال التحكم ---

        // إضافة شخص
        function addNewUser() {
            const newRef = db.ref('notebook_v3').push();
            newRef.set({ name: "", items: {} });
        }

        // تحديث اسم الشخص
        function updateName(userId, val) {
            db.ref(`notebook_v3/${userId}`).update({ name: val });
        }

        // حذف شخص
        function deleteUser(userId) {
            if(confirm("مسح الكارت بالكامل؟")) {
                db.ref(`notebook_v3/${userId}`).remove();
            }
        }

        // إضافة طلب جديد داخل الكارت
        function addItem(userId) {
            const itemRef = db.ref(`notebook_v3/${userId}/items`).push();
            itemRef.set({ text: "", price: "" });
        }

        // تحديث بيانات الطلب (الاسم او السعر)
        function updateItem(userId, itemId) {
            const text = document.getElementById(`iname-${itemId}`).value;
            const price = document.getElementById(`iprice-${itemId}`).value;
            
            db.ref(`notebook_v3/${userId}/items/${itemId}`).update({
                text: text,
                price: Number(price) // تحويل لرقم عشان الجمع
            });
        }

        // حذف طلب واحد
        function deleteItem(userId, itemId) {
            db.ref(`notebook_v3/${userId}/items/${itemId}`).remove();
        }

        // أنيميشن الأرقام
        function animateValue(id, start, end, duration) {
            if (start === end) return;
            const obj = document.getElementById(id);
            const range = end - start;
            let current = start;
            const increment = end > start ? 1 : -1;
            const stepTime = Math.abs(Math.floor(duration / range));
            const timer = setInterval(function() {
                current += increment;
                obj.innerText = current;
                if (current == end) clearInterval(timer);
            }, Math.max(stepTime, 10));
        }

        // تصوير الشاشة
        function takeScreenshot() {
            const btn = document.querySelector('.camera-btn');
            btn.innerHTML = "⏳";
            html2canvas(document.getElementById("capture-area"), {
                scale: 2, backgroundColor: "#FFFCF7"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Receipt-121.png';
                link.href = canvas.toDataURL();
                link.click();
                btn.innerHTML = "📸";
                alert("تم حفظ الفاتورة ✅");
            });
        }
    </script>
</body>
</html>
