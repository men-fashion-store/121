<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 2 1 - Notebook</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-desk: #e8e0d5;       /* لون المكتب الخشبي */
            --paper-color: #fffcf5;   /* لون الورق المصفر قليلًا */
            --line-color: #b5d0e2;    /* لون تسطير الكراسة (أزرق فاتح) */
            --margin-line: #ffcccc;   /* الخط الأحمر الطولي (الهامش) */
            --ink-color: #2c3e50;     /* لون الحبر (أزرق غامق مائل للسواد) */
            --brown-coffee: #4e342e;
        }

        body {
            font-family: 'Reem Kufi', 'Cairo', sans-serif;
            background-color: var(--bg-desk);
            /* ملمس خشب خفيف في الخلفية */
            background-image: url("https://www.transparenttextures.com/patterns/wood-pattern.png");
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- شاشة القفل --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--brown-coffee); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white;
        }
        .login-input {
            padding: 10px; font-size: 20px; border-radius: 5px; border: none; text-align: center; margin: 10px;
        }
        .login-btn {
            padding: 10px 30px; background: #d4a017; border: none; color: #fff; font-weight: bold; cursor: pointer; border-radius: 5px;
        }

        /* --- اللوجو --- */
        .header-area {
            text-align: center; margin-bottom: 20px;
            display: flex; align-items: center; gap: 15px;
        }
        .logo-text {
            font-size: 50px; font-weight: 900; color: var(--brown-coffee);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.4);
        }
        .bean { font-size: 35px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3)); }

        /* --- تصميم ورقة الكراسة (العبقرية هنا) --- */
        .notebook-sheet {
            width: 100%;
            max-width: 600px;
            background-color: var(--paper-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1), 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            padding: 40px 20px 40px 60px; /* الـ 60 عشان الهامش الأحمر */
            margin-bottom: 30px;
            border-radius: 2px;
            /* رسم الهامش الأحمر */
            background-image: linear-gradient(to left, transparent 55px, #ffb3b3 56px, transparent 57px);
        }

        /* ثقوب الكراسة */
        .notebook-sheet::before {
            content: ""; position: absolute; top: 0; right: 15px; bottom: 0; width: 30px;
            background-image: radial-gradient(circle, #333 30%, transparent 33%);
            background-size: 30px 40px; opacity: 0.1;
        }

        .person-section {
            margin-bottom: 50px;
            position: relative;
        }

        /* خانة الاسم (عنوان فوق السطور) */
        .name-header {
            width: 100%;
            border: none;
            background: transparent;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 24px;
            color: var(--brown-coffee);
            margin-bottom: 10px;
            border-bottom: 3px solid var(--brown-coffee);
            padding-bottom: 5px;
        }

        /* --- منطقة الكتابة المسطرة --- */
        /* دي الخدعة اللي بتخلي السطور مرسومة جوه الـ textarea */
        .ruled-textarea {
            width: 100%;
            border: none;
            background-color: transparent;
            /* رسم السطور بالـ CSS */
            background-image: repeating-linear-gradient(transparent, transparent 39px, var(--line-color) 40px);
            background-attachment: local; /* عشان السطور تتحرك مع الكتابة */
            line-height: 40px; /* لازم نفس ارتفاع السطر في الخلفية */
            font-size: 20px;
            font-family: 'Reem Kufi', cursive; /* خط يشبه خط اليد */
            color: var(--ink-color);
            outline: none;
            resize: none;
            overflow: hidden;
            padding-top: 6px; /* ضبط مكان الكلام على السطر */
        }
        
        .ruled-textarea::placeholder {
            color: rgba(0,0,0,0.2);
            font-size: 16px;
        }

        /* خانة المديونية تحت */
        .debt-footer {
            display: flex; justify-content: flex-end; align-items: center;
            margin-top: 10px; font-weight: bold; color: var(--brown-coffee);
        }
        .debt-input {
            width: 80px; border: 2px solid var(--brown-coffee); border-radius: 8px;
            text-align: center; padding: 5px; font-size: 18px; margin: 0 10px;
            color: #c0392b; background: rgba(255,255,255,0.5);
        }

        .status {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="header-area">
            <div class="bean">🫘</div>
            <div class="logo-text" style="color:#fff">1 2 1</div>
            <div class="bean" style="transform: scaleX(-1);">🫘</div>
        </div>
        <p>ممنوع الدخول لغير المشتركين</p>
        <input type="password" id="pass-input" class="login-input" placeholder="الرمز السري">
        <button onclick="checkPassword()" class="login-btn">فتح الكراسة</button>
        <p id="error-msg" style="display:none; color:#ff6b6b; margin-top:10px;">غلط!</p>
    </div>

    <div id="app-content" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        
        <div class="header-area">
            <div class="bean">🫘</div>
            <div class="logo-text">1 2 1</div>
            <div class="bean" style="transform: scaleX(-1);">🫘</div>
        </div>

        <div class="notebook-sheet">
            
            <div class="person-section">
                <input type="text" id="p1_name" class="name-header" placeholder="اسم الشخص الأول.." oninput="autoSave()">
                <textarea id="p1_note" class="ruled-textarea" 
                    placeholder="اكتب هنا.. ودوس Enter لفتح سطر جديد" 
                    oninput="autoSave(); autoResize(this)"></textarea>
                
                <div class="debt-footer">
                    <span>الحساب الكلي:</span>
                    <input type="number" id="p1_debt" class="debt-input" placeholder="0" oninput="autoSave()">
                    <span>ج.م</span>
                </div>
            </div>

            <div style="border-top: 2px dashed #999; margin: 30px 0; position: relative; opacity: 0.5;">
                <span style="position: absolute; left: -25px; top: -10px;">✂️</span>
            </div>

            <div class="person-section">
                <input type="text" id="p2_name" class="name-header" placeholder="اسم الشخص الثاني.." oninput="autoSave()">
                <textarea id="p2_note" class="ruled-textarea" 
                    placeholder="اكتب هنا.. ودوس Enter لفتح سطر جديد" 
                    oninput="autoSave(); autoResize(this)"></textarea>
                
                <div class="debt-footer">
                    <span>الحساب الكلي:</span>
                    <input type="number" id="p2_debt" class="debt-input" placeholder="0" oninput="autoSave()">
                    <span>ج.م</span>
                </div>
            </div>

        </div>

        <div id="status" class="status">جاري التحميل...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ------------------------------------------
        // الكود النهائي (تم دمج بياناتك)
        // ------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyC41wbgVjetsHSi0xyRsoZypigr9rDTwsY",
            authDomain: "project-5583219622905769256.firebaseapp.com",
            databaseURL: "https://project-5583219622905769256-default-rtdb.firebaseio.com",
            projectId: "project-5583219622905769256",
            storageBucket: "project-5583219622905769256.firebasestorage.app",
            messagingSenderId: "11178686775",
            appId: "1:11178686775:web:112f416c31f02233df42b2",
            measurementId: "G-RLHEZ6C1LV"
        };

        let db;

        // الباسورد
        function checkPassword() {
            if(document.getElementById('pass-input').value === "121") {
                document.getElementById('login-screen').style.display = "none";
                document.getElementById('app-content').style.display = "flex";
                initFirebase();
            } else {
                document.getElementById('error-msg').style.display = "block";
            }
        }

        function initFirebase() {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                
                // الاستماع
                db.ref('notebook_final').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        updateField('p1_name', data.p1?.name);
                        updateField('p1_note', data.p1?.note);
                        updateField('p1_debt', data.p1?.debt);
                        
                        updateField('p2_name', data.p2?.name);
                        updateField('p2_note', data.p2?.note);
                        updateField('p2_debt', data.p2?.debt);
                        document.getElementById('status').innerText = "✅ متصل";
                    }
                });
            }
        }

        function autoSave() {
            if(!db) return;
            document.getElementById('status').innerText = "💾 حفظ...";
            db.ref('notebook_final').set({
                p1: {
                    name: document.getElementById('p1_name').value,
                    note: document.getElementById('p1_note').value,
                    debt: document.getElementById('p1_debt').value
                },
                p2: {
                    name: document.getElementById('p2_name').value,
                    note: document.getElementById('p2_note').value,
                    debt: document.getElementById('p2_debt').value
                }
            });
        }

        function updateField(id, value) {
            const el = document.getElementById(id);
            if (document.activeElement !== el) {
                el.value = value || "";
                if(el.tagName === 'TEXTAREA') autoResize(el);
            }
        }

        // الكود ده بيخلي الصفحة تطول لوحدها لما تدوس انتر
        function autoResize(el) {
            el.style.height = 'auto';
            // الـ 40 دي عشان نضمن انها دايمًا بتقفل على سطر كامل (مضاعفات ارتفاع السطر)
            let newHeight = el.scrollHeight;
            el.style.height = newHeight + 'px';
        }
    </script>
</body>
</html>
